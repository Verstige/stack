name: Build Stack Realtime

on:
  push:
    branches: ["v4.x"]
    paths:
      - ".github/workflows/stack-realtime.yml"
      - "docker/coolify-realtime/Dockerfile"
      - "docker/coolify-realtime/terminal-server.js"
      - "docker/coolify-realtime/package.json"
      - "docker/coolify-realtime/package-lock.json"
      - "docker/coolify-realtime/soketi-entrypoint.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GITHUB_REGISTRY: ghcr.io
  IMAGE_NAME: "verstige/stack-realtime"

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getRealtimeVersion.php)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push Image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coolify-realtime/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-${{ matrix.tag_arch }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getRealtimeVersion.php)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create & publish manifest
        run: |
          docker buildx imagetools create \
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-amd64 \
          ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-aarch64 \
          --tag ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} \
          --tag ghcr.io/${{ env.IMAGE_NAME }}:latest
